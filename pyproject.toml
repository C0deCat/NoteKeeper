[project]
name = "notekeeper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.138.2",
    "openai>=2.44.0",
    "psutil>=7.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "rich>=14.0.0",
    "speechbrain>=1.1.0",
    "textual>=8.2.8",
    "tiktoken>=0.13.0",
    "torch==2.8.0 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchaudio==2.8.0 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchvision==0.23.0 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "typer>=0.26.8",
    "uvicorn[standard]>=0.49.0",
    "whisperx==3.8.6",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
notekeeper = "notekeeper.composition.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notekeeper"]
artifacts = ["src/notekeeper/interfaces/tui/styles.tcss"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
